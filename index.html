<!doctype html>
<html lang="ca" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ecosistema digital · revisió visual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens mirrored from assets/styles.css so this file renders alone. */
      :root {
        --base: #1e1e2e;
        --surface: #2a2a3e;
        --surface-2: #23233a;
        --overlay: #31314a;
        --line: #3b3b55;
        --strong: #f4f4fb;
        --body: #d6d6e6;
        --muted: #a6a6c2;
        --muted-2: #7e7e9c;
        --brand: #8f8cf5;
        --brand-ink: #c3c1ff;
        --brand-soft: rgba(143, 140, 245, 0.16);
        --brand-contrast: #16162a;
        --success: #4ad6a5;
        --success-soft: rgba(74, 214, 165, 0.14);
        --success-ink: #7ee8c3;
        --warning: #f0b661;
        --warning-soft: rgba(240, 182, 97, 0.14);
        --warning-ink: #f7cf95;
        --danger: #f2788f;
        --danger-soft: rgba(242, 120, 143, 0.14);
        --danger-ink: #ff9fb0;
        --info: #7fb6f5;
        --info-soft: rgba(127, 182, 245, 0.14);
        --info-ink: #a9cffb;
        --scrim: rgba(12, 12, 24, 0.65);
        --shadow: 0 1px 2px rgba(8, 8, 20, 0.35);
        --overlay-shadow: 0 18px 40px -20px rgba(8, 8, 20, 0.75);
        --radius: 8px;
        --radius-md: 6px;
        --radius-sm: 4px;
        --pad: 1;
        color-scheme: dark;
      }

      html.light {
        --base: #f3f4fa;
        --surface: #ffffff;
        --surface-2: #f7f8fc;
        --overlay: #ffffff;
        --line: #dfe1ee;
        --strong: #1b1b2f;
        --body: #3b3b52;
        --muted: #5f5f7a;
        --muted-2: #85859c;
        --brand: #5b57e8;
        --brand-ink: #403bb8;
        --brand-soft: rgba(91, 87, 232, 0.1);
        --brand-contrast: #ffffff;
        --success: #1f9d76;
        --success-soft: rgba(31, 157, 118, 0.12);
        --success-ink: #15795b;
        --warning: #c58420;
        --warning-soft: rgba(197, 132, 32, 0.13);
        --warning-ink: #8f5f11;
        --danger: #d1435f;
        --danger-soft: rgba(209, 67, 95, 0.12);
        --danger-ink: #a52c45;
        --info: #2f6fd0;
        --info-soft: rgba(47, 111, 208, 0.11);
        --info-ink: #24559f;
        --scrim: rgba(24, 24, 44, 0.4);
        --shadow: 0 1px 2px rgba(24, 24, 48, 0.08);
        --overlay-shadow: 0 18px 40px -24px rgba(24, 24, 48, 0.35);
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--base);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        color: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100vh;
      }

      /* Section anchors let the shell nav jump without a router. */
      [id^="section-"] {
        scroll-margin-top: 88px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      crossorigin
      src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"
    ></script>
    <script type="text/babel" data-type="module" data-presets="react">
      import { createRoot } from "react-dom/client";
      import App from "./App.jsx";
      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
